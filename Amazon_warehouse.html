<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amazon 美国仓库 · Census 4 大区域 / 9 分区</title>
<style>
:root {
    --bg: #f3f4f6;
    --panel: #ffffff;
    --ink: #16181d;
    --muted: #5e6672;
    --faint: #8a929e;
    --line: #e2e5ea;
    --line-strong: #cdd3db;
    --accent: #0f6fbf;
    --accent-soft: #e9f2fb;
    --orange: #d97706;
    --orange-soft: #fff4e1;
    --green: #14805c;
    --green-soft: #e6f6f0;
    --danger: #b42318;
    --topbar: #10151d;
    --topbar-text: #f5f6f8;
    --mono: "SFMono-Regular", "Cascadia Code", Consolas, "Liberation Mono", Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    --radius: 8px;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    height: 100%;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.45;
  }

  button,
  input {
    font: inherit;
    color: inherit;
  }

  button {
    border: 0;
    cursor: pointer;
  }

  svg {
    display: block;
    width: 16px;
    height: 16px;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
  }

  .topbar {
    height: 64px;
    background: var(--topbar);
    color: var(--topbar-text);
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 0 20px;
    flex: 0 0 auto;
    position: relative;
    z-index: 20;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }

  .brand-mark {
    width: 38px;
    height: 38px;
    border-radius: var(--radius);
    background: linear-gradient(135deg, #ff9900, #e8790f);
    color: #17110a;
    font-weight: 800;
    font-size: 14px;
    letter-spacing: 0;
    display: grid;
    place-items: center;
    flex: 0 0 auto;
  }

  .brand h1 {
    margin: 0;
    font-size: 17px;
    font-weight: 700;
    line-height: 1.2;
    white-space: nowrap;
  }

  .brand-sub {
    margin: 2px 0 0;
    font-size: 12px;
    color: #9aa4b1;
    white-space: nowrap;
  }

  .global-search {
    position: relative;
    flex: 1 1 320px;
    max-width: 620px;
    display: flex;
    align-items: center;
  }

  .global-search > svg {
    position: absolute;
    left: 12px;
    width: 17px;
    height: 17px;
    color: #6d7785;
    pointer-events: none;
  }

  .global-search input {
    width: 100%;
    height: 40px;
    border: 1px solid #303a48;
    border-radius: var(--radius);
    background: #1c232e;
    color: #f3f5f8;
    padding: 0 38px 0 40px;
    outline: none;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .global-search input::placeholder {
    color: #7f8a99;
  }

  .global-search input:focus {
    border-color: #ff9900;
    background: #222b37;
  }

  .clear-btn {
    position: absolute;
    right: 6px;
    width: 28px;
    height: 28px;
    border-radius: 6px;
    display: grid;
    place-items: center;
    background: transparent;
    color: #8b96a4;
  }

  .clear-btn:hover {
    background: #2b3542;
    color: #f3f5f8;
  }

  .stat-pills {
    display: flex;
    gap: 8px;
    margin-left: auto;
    flex: 0 0 auto;
  }

  .stat-pill {
    background: #1b222c;
    border: 1px solid #2c3644;
    color: #c4ccd6;
    border-radius: var(--radius);
    padding: 6px 10px;
    font-size: 12px;
    white-space: nowrap;
  }

  .stat-pill b {
    color: #ffffff;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .lang-switch {
    display: flex;
    flex: 0 0 auto;
    gap: 2px;
    padding: 3px;
    background: #1b222c;
    border: 1px solid #2c3644;
    border-radius: var(--radius);
  }

  .lang-btn {
    height: 28px;
    padding: 0 11px;
    border-radius: 6px;
    background: transparent;
    color: #9aa4b1;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
  }

  .lang-btn:hover {
    color: #f3f5f8;
  }

  .lang-btn.is-active {
    background: #ff9900;
    color: #17110a;
  }

  .layout {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: 276px minmax(0, 1fr);
  }

  .sidebar {
    background: var(--panel);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    min-height: 0;
    padding: 14px 12px;
    gap: 10px;
  }

  .side-label {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 0 6px;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
  }

  .side-label span {
    color: var(--faint);
    font-weight: 500;
  }

  .side-search {
    position: relative;
  }

  .side-search svg {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    width: 15px;
    height: 15px;
    color: var(--faint);
    pointer-events: none;
  }

  .side-search input {
    width: 100%;
    height: 36px;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: #fafbfc;
    padding: 0 10px 0 34px;
    outline: none;
  }

  .side-search input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
    background: #ffffff;
  }

  .gl-list {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding-right: 2px;
  }

  .gl-item {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    min-height: 34px;
    padding: 6px 10px;
    border-radius: 6px;
    background: transparent;
    text-align: left;
    color: var(--ink);
    border: 1px solid transparent;
    transition: background 0.12s ease;
  }

  .gl-item:hover {
    background: #f0f3f6;
  }

  .gl-item.is-active {
    background: var(--accent-soft);
    border-color: #bcd8f1;
    color: #0a4d86;
    font-weight: 600;
  }

  .gl-item-name {
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .gl-item-count {
    flex: 0 0 auto;
    font-size: 11px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    background: #eef1f4;
    border-radius: 999px;
    padding: 2px 7px;
  }

  .gl-item.is-active .gl-item-count {
    background: #d3e7f9;
    color: #0a4d86;
  }

  .gl-empty {
    padding: 18px 10px;
    color: var(--faint);
    font-size: 13px;
    text-align: center;
  }

  .main {
    min-width: 0;
    min-height: 0;
    overflow-y: auto;
    padding: 24px 28px 40px;
  }

  .page {
    max-width: 1240px;
    margin: 0 auto;
  }

  .view-head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }

  .view-head h2 {
    margin: 0;
    font-size: 24px;
    line-height: 1.25;
    letter-spacing: 0;
  }

  .view-sub {
    margin: 6px 0 0;
    color: var(--muted);
    font-size: 13px;
  }

  .view-sub b {
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }

  .gl-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(228px, 1fr));
    gap: 12px;
  }

  .gl-card {
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 118px;
    padding: 14px 16px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--panel);
    text-align: left;
    transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
  }

  .gl-card:hover {
    border-color: var(--accent);
    box-shadow: 0 4px 14px rgba(15, 111, 191, 0.1);
    transform: translateY(-1px);
  }

  .gl-card-name {
    font-size: 15px;
    font-weight: 700;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .gl-card-stats {
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .gl-card-stats b {
    color: var(--accent);
  }

  .gl-card-cats {
    font-size: 12px;
    color: var(--faint);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .detail-head {
    margin-bottom: 16px;
  }

  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    margin: 0 0 12px -10px;
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    font-size: 13px;
  }

  .back-btn:hover {
    background: #eef1f4;
    color: var(--ink);
  }

  .detail-title {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .detail-title h2 {
    margin: 0;
    font-size: 26px;
    line-height: 1.25;
    letter-spacing: 0;
  }

  .badges {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .badge {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    background: #eef1f4;
    border-radius: 999px;
    padding: 3px 9px;
    white-space: nowrap;
  }

  .badge.badge-blue {
    color: #0a4d86;
    background: var(--accent-soft);
  }

  .badge.badge-orange {
    color: #9a5206;
    background: var(--orange-soft);
  }

  .detail-tools {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 14px;
  }

  .detail-search {
    position: relative;
    flex: 1 1 240px;
    max-width: 360px;
  }

  .detail-search svg {
    position: absolute;
    left: 11px;
    top: 50%;
    transform: translateY(-50%);
    width: 15px;
    height: 15px;
    color: var(--faint);
    pointer-events: none;
  }

  .detail-search input {
    width: 100%;
    height: 36px;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: var(--panel);
    padding: 0 10px 0 34px;
    outline: none;
  }

  .detail-search input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .tool-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 36px;
    padding: 0 12px;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: var(--panel);
    color: var(--muted);
    font-size: 13px;
    white-space: nowrap;
  }

  .tool-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-soft);
  }

  .section-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .group {
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: var(--panel);
    overflow: hidden;
    margin-bottom: 10px;
  }

  .group-toggle {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    min-height: 48px;
    padding: 9px 12px;
    background: #f6f8fa;
    text-align: left;
    border-bottom: 1px solid transparent;
  }

  .group-toggle:hover,
  .group-toggle[aria-expanded="true"] {
    background: #eef3f8;
  }

  .group-toggle[aria-expanded="true"] {
    border-bottom-color: var(--line);
  }

  .group-name {
    flex: 1 1 auto;
    min-width: 0;
    font-weight: 700;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .group-count {
    flex: 0 0 auto;
    font-size: 12px;
    color: var(--muted);
    background: #e8ecf1;
    border-radius: 999px;
    padding: 3px 9px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .group-body {
    border-top: 1px solid var(--line);
    background: #fbfcfd;
    padding: 8px;
  }

  .group-body .section-list {
    gap: 6px;
  }

  .section {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--panel);
    overflow: hidden;
  }

  .cat-toggle {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    min-height: 46px;
    padding: 8px 12px;
    background: var(--panel);
    text-align: left;
    border-bottom: 1px solid transparent;
  }

  .cat-toggle:hover {
    background: #f8fafb;
  }

  .cat-toggle[aria-expanded="true"] {
    border-bottom-color: var(--line);
  }

  .chevron {
    flex: 0 0 18px;
    display: grid;
    place-items: center;
    color: var(--faint);
    transition: transform 0.15s ease;
  }

  .chevron svg {
    width: 15px;
    height: 15px;
  }

  .cat-toggle[aria-expanded="true"] .chevron {
    transform: rotate(90deg);
    color: var(--accent);
  }

  .cat-code {
    flex: 0 0 auto;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 5px;
    padding: 3px 7px;
    font-variant-numeric: tabular-nums;
  }

  .cat-name {
    flex: 1 1 auto;
    min-width: 0;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .cat-count {
    flex: 0 0 auto;
    font-size: 11px;
    color: var(--muted);
    background: #eef1f4;
    border-radius: 999px;
    padding: 2px 8px;
    font-variant-numeric: tabular-nums;
  }

  .cat-body {
    border-top: 1px solid var(--line);
    background: #fbfcfd;
  }

  .sub-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 7px 12px 7px 40px;
    border-bottom: 1px solid #eef1f4;
    min-height: 36px;
  }

  .sub-row:last-child {
    border-bottom: 0;
  }

  .sub-row:hover {
    background: #f5f8fb;
  }

  .sub-code {
    flex: 0 0 96px;
    font-family: var(--mono);
    font-size: 12px;
    color: #3d4a5c;
    font-variant-numeric: tabular-nums;
  }

  .sub-name {
    flex: 1 1 auto;
    min-width: 0;
    font-size: 13px;
  }

  .copy-btn {
    flex: 0 0 30px;
    width: 30px;
    height: 30px;
    border-radius: 6px;
    display: grid;
    place-items: center;
    background: transparent;
    color: var(--faint);
    border: 1px solid transparent;
  }

  .copy-btn:hover {
    background: var(--panel);
    border-color: var(--line-strong);
    color: var(--accent);
  }

  .copy-btn.copied {
    background: var(--green-soft);
    border-color: #bfe6d8;
    color: var(--green);
  }

  .result-group {
    margin-bottom: 16px;
  }

  .gl-badge {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 8px;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: var(--panel);
    text-align: left;
  }

  .gl-badge:hover {
    border-color: var(--accent);
    background: var(--accent-soft);
  }

  .gl-badge-name {
    font-size: 14px;
    font-weight: 700;
  }

  .gl-badge-count {
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  mark {
    background: #ffe28a;
    color: #5b3b00;
    border-radius: 3px;
    padding: 0 2px;
  }

  .empty-state {
    padding: 56px 20px;
    text-align: center;
    color: var(--faint);
    border: 1px dashed var(--line-strong);
    border-radius: var(--radius);
    background: var(--panel);
  }

  .empty-state b {
    display: block;
    margin-bottom: 6px;
    font-size: 16px;
    color: var(--muted);
  }

  .footer-note {
    margin-top: 26px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
    color: var(--faint);
    font-size: 12px;
  }

  @media (max-width: 980px) {
    .topbar {
      height: auto;
      min-height: 64px;
      flex-wrap: wrap;
      padding: 10px 16px;
      gap: 12px;
    }

    .global-search {
      order: 3;
      flex: 1 1 100%;
      max-width: none;
    }

    .stat-pills {
      margin-left: auto;
    }

    .layout {
      display: block;
    }

    .sidebar {
      border-right: 0;
      border-bottom: 1px solid var(--line);
      padding: 10px 14px 12px;
      max-height: 180px;
      overflow: hidden;
    }

    .side-label {
      display: none;
    }

    .side-search input {
      height: 34px;
    }

    .gl-list {
      flex-direction: row;
      overflow-x: auto;
      overflow-y: hidden;
      padding-bottom: 6px;
      gap: 6px;
    }

    .gl-item {
      flex: 0 0 auto;
      width: auto;
      min-height: 32px;
      padding: 5px 10px;
      white-space: nowrap;
      background: #f1f3f6;
    }

    .gl-item-name {
      white-space: nowrap;
    }

    .main {
      padding: 18px 16px 32px;
    }

    .sub-row {
      padding-left: 34px;
    }

    .sub-code {
      flex-basis: 84px;
    }
  }

  @media (max-width: 620px) {
    .stat-pills {
      display: none;
    }

    .view-head h2 {
      font-size: 21px;
    }

    .detail-title h2 {
      font-size: 22px;
    }

    .gl-grid {
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .gl-card {
      min-height: 104px;
      padding: 12px;
    }

    .cat-toggle {
      gap: 8px;
      padding: 8px 10px;
    }

    .cat-code {
      font-size: 11px;
      padding: 2px 5px;
    }

    .sub-row {
      padding: 7px 10px 7px 30px;
    }

    .sub-code {
      flex-basis: 74px;
      font-size: 11px;
    }
  }

/* Warehouse region list overrides */
:root{--wc:#0f766e;--ct:#be123c;--ma:#2563eb;--ne:#7c3aed;--se:#c2410c}
.region-swatch{width:10px;height:10px;border-radius:3px;flex:0 0 auto;background:var(--muted)}
.gl-item .region-swatch{margin-right:2px}
.gl-item.is-active .region-swatch{box-shadow:0 0 0 2px rgba(15,111,191,.18)}
.wh-list-title{font-size:15px;font-weight:800;margin:0 0 12px}
.wh-sub{color:var(--muted);font-size:13px;margin:-8px 0 14px;max-width:900px}
.wh-stat-line{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.wh-stat{display:inline-flex;align-items:center;gap:6px;background:#f0f3f6;border:1px solid var(--line-strong);border-radius:7px;padding:4px 9px;font-size:12px;color:#3d4a58}
.wh-stat b{font-weight:800}
.region-block{border:1px solid var(--line-strong);border-left:4px solid var(--block-color,var(--line-strong));border-radius:var(--radius);background:var(--panel);overflow:hidden;margin-bottom:14px}
.region-block.r-WestCoast{--block-color:var(--wc)}
.region-block.r-Central{--block-color:var(--ct)}
.region-block.r-MidAtlantic{--block-color:var(--ma)}
.region-block.r-NorthEast{--block-color:var(--ne)}
.region-block.r-SouthEast{--block-color:var(--se)}
.region-block-head{display:flex;align-items:center;gap:10px;width:100%;padding:11px 14px;background:#f6f8fa;border:0;text-align:left;color:var(--ink)}
.region-block-head:hover{background:#eef3f8}
.region-block-head .region-swatch{width:11px;height:11px;border-radius:50%}
.region-block-head h3{margin:0;font-size:16px;font-weight:800;flex:1;min-width:0}
.region-block-head .view-meta{font-size:12px;color:var(--muted);white-space:nowrap}
.region-block-head .view-link{font-size:12px;font-weight:700;color:var(--accent);white-space:nowrap}
.region-block-body{padding:10px 10px 14px}
.group{margin-bottom:8px}
.group:last-child{margin-bottom:0}
.group-toggle{min-height:42px;padding:7px 10px;background:#fafbfc}

ington","WV":"West Virginia","WI":"Wisconsin","WY":"Wyoming"},"census":[{"key":"Northeast","label":"Northeast 东北部","color":"#0f766e","divisions":[{"key":"New England","label":"New England 新英格兰","states":["CT","ME","MA","NH","RI","VT"]},{"key":"Middle Atlantic","label":"Middle Atlantic 中大西洋","states":["NJ","NY","PA"]}]},{"key":"Midwest","label":"Midwest 中西部","color":"#b45309","divisions":[{"key":"East North Central","label":"East North Central 中北东部","states":["IL","IN","MI","OH","WI"]},{"key":"West North Central","label":"West North Central 中北西部","states":["IA","KS","MN","MO","NE","ND","SD"]}]},{"key":"South","label":"South 南部","color":"#be123c","divisions":[{"key":"South Atlantic","label":"South Atlantic 南大西洋","states":["DE","DC","FL","GA","MD","NC","SC","VA","WV"]},{"key":"East South Central","label":"East South Central 中南东部","states":["AL","KY","MS","TN"]},{"key":"West South Central","label":"West South Central 中南西部","states":["AR","LA","OK","TX"]}]},{"key":"West","label":"West 西部","color":"#2563eb","divisions":[{"key":"Mountain","label":"Mountain 山地","states":["AZ","CO","ID","MT","NM","NV","UT","WY"]},{"key":"Pacific","label":"Pacific 太平洋","states":["AK","CA","HI","OR","WA"]}]}],"rixdNetwork":[{"key":"WestCoast","label":"WestCoast 西岸","color":"#0f766e","codes":["GYR3","LAS1","LAX9","LGB8","SCK4","SMF3","VGT2"]},{"key":"Central","label":"Central 中区","color":"#be123c","codes":["FTW1","ONT8","IND9","MDW2","SBD1","XBN3"]},{"key":"MidAtlantic","label":"MidAtlantic 中大西洋","color":"#2563eb","codes":["ABE8","FWA4","MQJ1","RFD2","ORF2","RMN3"]},{"key":"NorthEast","label":"NorthEast 东北","color":"#7c3aed","codes":["AVP1","SWF2","TEB9","XCH2"]},{"key":"SouthEast","label":"SouthEast 东南","color":"#c2410c","codes":["CLT2","GYR2","MEM1","RDU2","IAH3","XMI3"]}]}</script>
<script>
(function(){
  "use strict";
  const payload = JSON.parse(document.getElementById("page-payload").textContent);
  const RECORDS = payload.records;
  const STATE_NAMES = payload.stateNames;
  const CENSUS = payload.census;
  const RIXD_NETWORK = payload.rixdNetwork;
  const TOTAL = RECORDS.length;
  const RIXD_RECORDS = RECORDS.filter(function(row) { return row.rixd; });

  const esc = function(value) {
    return String(value == null ? "" : value).replace(/[&<>"']/g, function(ch) {
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch];
    });
  };
  const countBy = function(field, key) {
    return RECORDS.filter(function(row) { return row[field] === key; }).length;
  };
  const divisionCount = function(key) {
    return RECORDS.filter(function(row) { return row.division === key; }).length;
  };
  const rowsForDivision = function(key) {
    return RECORDS.filter(function(row) { return row.division === key; }).sort(function(a, b) {
      return a.state.localeCompare(b.state) || a.code.toLowerCase().localeCompare(b.code.toLowerCase());
    });
  };
  const allDivisions = function() {
    const out = [];
    CENSUS.forEach(function(region) {
      region.divisions.forEach(function(division) { out.push(division); });
    });
    return out;
  };
  const haystack = function(row) {
    return [row.code, row.city, row.state, STATE_NAMES[row.state] || row.state, row.zip, row.addr, row.name].join(" ").toLowerCase();
  };

  let state = {
    selectedRegion: "",
    selectedDivision: "",
    rixdView: false,
    query: ""
  };

  const icons = {
    chevron: '<svg aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>',
    copy: '<svg aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></svg>'
  };

  function rowHTML(row) {
    const name = row.name && row.name !== row.code ? '<span class="wh-name">' + esc(row.name) + "</span>" : "";
    const rixd = row.rixd ? '<span class="tag-rixd">rIXD</span>' : "";
    return (
      '<div class="wh-row">' +
      '<div class="wh-code-wrap"><div><span class="wh-code">' + esc(row.code) + "</span>" + rixd + "</div>" + name + "</div>" +
      '<div class="wh-detail"><div class="wh-city">' + esc(row.city) + ", " + esc(row.state) + " " + esc(row.zip) + "</div>" +
      '<div class="wh-address">' + (row.addr ? esc(row.addr) : "地址未提供") + "</div></div>" +
      '<button class="copy-btn js-copy" type="button" data-code="' + esc(row.code) + '" aria-label="复制地址">' + icons.copy + "</button>" +
      "</div>"
    );
  }

  function sortedRows(rows) {
    return rows.slice().sort(function(a, b) {
      return a.state.localeCompare(b.state) || a.city.localeCompare(b.city) || a.code.toLowerCase().localeCompare(b.code.toLowerCase());
    });
  }

  function selectedRows() {
    if (state.selectedDivision) {
      return sortedRows(RECORDS.filter(function(row) { return row.division === state.selectedDivision; }));
    }
    if (state.selectedRegion) {
      return sortedRows(RECORDS.filter(function(row) { return row.region === state.selectedRegion; }));
    }
    return sortedRows(RECORDS);
  }

  function allRegionsHTML() {
    return (
      '<div class="view-head"><div><h2>全部 Warehouse ID</h2>' +
      '<p class="wh-sub">' + TOTAL + " 个记录 · 4 大区域 / 9 分区，可在左侧目录继续筛选</p></div></div>" +
      '<div class="warehouse-list">' + selectedRows().map(rowHTML).join("") + "</div>"
    );
  }

  function regionHTML() {
    const region = CENSUS.filter(function(r) { return r.key === state.selectedRegion; })[0];
    if (!region) return allRegionsHTML();
    const count = countBy("region", region.key);
    return (
      '<div class="view-head"><div><h2>' + esc(region.label) + "</h2>" +
      '<p class="wh-sub">' + count + " 个 Warehouse ID · " + region.divisions.length + " 个分区</p></div></div>" +
      '<div class="warehouse-list">' + selectedRows().map(rowHTML).join("") + "</div>"
    );
  }

  function divisionHTML() {
    let region = null;
    let division = null;
    CENSUS.forEach(function(r) {
      r.divisions.forEach(function(d) {
        if (d.key === state.selectedDivision) {
          region = r;
          division = d;
        }
      });
    });
    if (!division) return allRegionsHTML();
    const count = divisionCount(division.key);
    return (
      '<div class="view-head"><div><h2>' + esc(division.label) + "</h2>" +
      '<p class="wh-sub">' + esc(region.label) + " · " + count + " 个 Warehouse ID</p></div></div>" +
      '<div class="warehouse-list">' + selectedRows().map(rowHTML).join("") + "</div>"
    );
  }

  function rixdOverviewHTML() {
    const summary = RIXD_NETWORK.map(function(region) {
      const rows = RIXD_RECORDS.filter(function(row) { return row.rixdRegion === region.key; });
      return (
        '<div class="rixd-stat" style="--rc:' + esc(region.color) + '">' +
        '<span class="rs-name">' + esc(region.label) + "</span>" +
        '<span class="rs-num">' + rows.length + "</span>" +
        '<span class="rs-sub">' + rows.length + " 个 rIXD</span></div>"
      );
    }).join("");
    const blocks = RIXD_NETWORK.map(function(region) {
      const rows = RIXD_RECORDS.filter(function(row) { return row.rixdRegion === region.key; }).sort(function(a, b) {
        return a.code.toLowerCase().localeCompare(b.code.toLowerCase());
      });
      return (
        '<section class="region-block" style="--block-color:' + esc(region.color) + ';border-left-color:' + esc(region.color) + '">' +
        '<div class="region-block-head"><span class="region-swatch" style="background:' + esc(region.color) + '"></span>' +
        '<h3>' + esc(region.label) + "</h3>" +
        '<span class="view-meta">' + rows.length + " 个 rIXD</span></div>" +
        '<div class="region-block-body"><div class="warehouse-list">' + rows.map(rowHTML).join("") + "</div></div></section>"
      );
    }).join("");
    return (
      '<div class="view-head"><div><h2>rIXD 快速总览</h2>' +
      '<p class="wh-sub">' + RIXD_RECORDS.length + " 个 Regional IXD · 按 Amazon 网络 5 大区域分组</p></div></div>" +
      '<div class="rixd-summary">' + summary + "</div>" + blocks
    );
  }

  function searchHTML() {
    const q = state.query.trim().toLowerCase();
    if (!q) {
      if (state.rixdView) return rixdOverviewHTML();
      return state.selectedDivision ? divisionHTML() : (state.selectedRegion ? regionHTML() : allRegionsHTML());
    }
    const matches = RECORDS.filter(function(row) { return haystack(row).indexOf(q) >= 0; }).sort(function(a, b) {
      return a.region.localeCompare(b.region) || a.division.localeCompare(b.division) || a.code.toLowerCase().localeCompare(b.code.toLowerCase());
    });
    if (!matches.length) {
      return '<div class="empty-state"><b>没有匹配的 Warehouse ID</b>试试输入代码、州名、城市或地址关键词。</div>';
    }
    let html = '<div class="view-head"><div><h2>搜索结果</h2><p class="wh-sub">' + matches.length + " 条匹配 · Warehouse ID / city / state / address</p></div></div>";
    CENSUS.forEach(function(region) {
      const regionRows = matches.filter(function(row) { return row.region === region.key; });
      if (!regionRows.length) return;
      html += '<section class="region-block r-' + esc(region.key) + '">' +
        '<button class="region-block-head js-region" type="button" data-region="' + esc(region.key) + '">' +
        '<span class="region-swatch" style="background:' + esc(region.color) + '"></span>' +
        '<h3>' + esc(region.label) + "</h3>" +
        '<span class="view-meta">' + regionRows.length + " 条</span><span class=\"view-link\">查看</span></button>" +
        '<div class="region-block-body"><div class="warehouse-list">' + regionRows.map(rowHTML).join("") + "</div></div></section>";
    });
    return html;
  }

  function renderMain() {
    const body = state.query.trim() ? searchHTML() : (state.rixdView ? rixdOverviewHTML() : (state.selectedDivision ? divisionHTML() : (state.selectedRegion ? regionHTML() : allRegionsHTML())));
    document.getElementById("mainPage").innerHTML = body + '<p class="footnote">口径：4 大区域与 9 分区按美国人口普查局常见划分；rIXD 标签来自 RACR 静态区域对照表，其中 XBN3 / XCH2 / XMI3 的地址由该工作簿补齐。</p>';
  }

  function renderRegionList() {
    const rixdActive = state.rixdView && !state.query;
    const allActive = !state.rixdView && !state.selectedRegion && !state.selectedDivision && !state.query;
    let html = '<button class="gl-item quick-rixd js-rixd-overview' + (rixdActive ? " is-active" : "") + '" type="button">' +
      '<span class="quick-rixd-mark">rIXD</span><span class="gl-item-name">快速总览</span>' +
      '<span class="gl-item-count">' + RIXD_RECORDS.length + "</span></button>" +
      '<button class="gl-item js-all' + (allActive ? " is-active" : "") + '" type="button">' +
      '<span class="region-swatch" style="background:#64748b"></span><span class="gl-item-name">全部区域</span>' +
      '<span class="gl-item-count">' + TOTAL + "</span></button>";
    CENSUS.forEach(function(region) {
      const regionActive = !state.rixdView && state.selectedRegion === region.key && !state.selectedDivision && !state.query;
      html += '<div class="tree-region">' +
        '<button class="gl-item region-row js-region' + (regionActive ? " is-active" : "") + '" type="button" data-region="' + esc(region.key) + '">' +
        '<span class="region-swatch" style="background:' + esc(region.color) + '"></span><span class="gl-item-name">' + esc(region.label) + "</span>" +
        '<span class="gl-item-count">' + countBy("region", region.key) + "</span></button>" +
        '<div class="tree-children">' +
        region.divisions.map(function(division) {
          const active = !state.rixdView && state.selectedDivision === division.key && !state.query;
          return '<button class="gl-item child-row js-division' + (active ? " is-active" : "") + '" type="button" data-region="' + esc(region.key) + '" data-division="' + esc(division.key) + '">' +
            '<span class="division-dot" style="background:' + esc(region.color) + '"></span>' +
            '<span class="child-name">' + esc(division.label) + "</span>" +
            '<span class="gl-item-count">' + divisionCount(division.key) + "</span></button>";
        }).join("") +
        "</div></div>";
    });
    document.getElementById("regionList").innerHTML = html;
  }

  function selectRegion(region) {
    state.rixdView = false;
    state.selectedRegion = region || "";
    state.selectedDivision = "";
    state.query = "";
    document.getElementById("searchInput").value = "";
    renderAll();
  }

  function selectDivision(region, division) {
    state.rixdView = false;
    state.selectedRegion = region;
    state.selectedDivision = division;
    state.query = "";
    document.getElementById("searchInput").value = "";
    renderAll();
  }

  function selectAll() {
    state.rixdView = false;
    state.selectedRegion = "";
    state.selectedDivision = "";
    state.query = "";
    document.getElementById("searchInput").value = "";
    renderAll();
  }

  function selectRixdOverview() {
    state.rixdView = true;
    state.selectedRegion = "";
    state.selectedDivision = "";
    state.query = "";
    document.getElementById("searchInput").value = "";
    renderAll();
  }

  function renderAll() {
    renderRegionList();
    renderMain();
  }

  const fallbackCopy = function(text, done) {
    const area = document.createElement("textarea");
    area.value = text;
    area.style.position = "fixed";
    area.style.opacity = "0";
    document.body.appendChild(area);
    area.select();
    try { document.execCommand("copy"); done(); } catch (err) {}
    document.body.removeChild(area);
  };

  function copyCode(code) {
    const row = RECORDS.filter(function(item) { return item.code === code; })[0];
    if (!row) return;
    const text = [row.addr, row.city + ", " + row.state + " " + row.zip].filter(Boolean).join("\n");
    const btn = document.querySelector('.js-copy[data-code="' + code + '"]');
    const done = function() {
      if (btn) {
        btn.classList.add("copied");
        setTimeout(function() { btn.classList.remove("copied"); }, 1200);
      }
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(function() { fallbackCopy(text, done); });
    } else {
      fallbackCopy(text, done);
    }
  }

  document.addEventListener("click", function(event) {
    const rixdBtn = event.target.closest(".js-rixd-overview");
    if (rixdBtn) { selectRixdOverview(); return; }
    const allBtn = event.target.closest(".js-all");
    if (allBtn) { selectAll(); return; }
    const divisionBtn = event.target.closest(".js-division");
    if (divisionBtn) { selectDivision(divisionBtn.dataset.region, divisionBtn.dataset.division); return; }
    const regionBtn = event.target.closest(".js-region");
    if (regionBtn) { selectRegion(regionBtn.dataset.region); return; }
    const copyBtn = event.target.closest(".js-copy");
    if (copyBtn) { copyCode(copyBtn.dataset.code); }
  });

  const searchInput = document.getElementById("searchInput");
  searchInput.addEventListener("input", function(event) {
    state.query = event.target.value;
    renderRegionList();
    renderMain();
  });
  searchInput.addEventListener("keydown", function(event) {
    if (event.key === "Enter" && state.query.trim()) {
      const first = document.querySelector("#mainPage .js-copy");
      if (first) first.scrollIntoView({block:"center", behavior:"smooth"});
    }
  });

  renderAll();
})();
</script>
</body>
</html>
